name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run tests
        run: pytest tests/ -q
      - name: Compile package
        run: python -m compileall -q src/mcp_huddle
      - name: Verify CLI version
        run: python -m mcp_huddle --version

  dependency-floors:
    name: Declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install declared minimum versions
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          "mcp==1.28.1" "starlette==1.0.1" "uvicorn==0.32.0"
          "pytest==8.0.0" "httpx==0.27.1"
      - name: Install project without re-resolving dependencies
        run: python -m pip install --disable-pip-version-check --no-input --no-deps -e .
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run tests at dependency floors
        run: pytest tests/ -q

  dashboard:
    name: Dashboard syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript syntax
        run: node --check src/mcp_huddle/static/dashboard.js

  wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel --disable-pip-version-check --no-input --no-deps --wheel-dir dist .
