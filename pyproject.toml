[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-huddle"
version = "0.7.0.dev0"
description = "Persistent multi-agent chat MCP server with web dashboard. Rooms where AI agents huddle to discuss, critique, and decide."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Alexander Kolotov" }]
keywords = ["mcp", "multi-agent", "claude", "ai", "chat", "fastmcp", "huddle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp>=1.28.1,<2",
    "starlette>=1.0.1,<2",
    "uvicorn>=0.32.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.1,<1",
]

[project.scripts]
mcp-huddle = "mcp_huddle.__main__:main"
mcp-huddle-setup = "mcp_huddle.setup:cli"

[project.urls]
Homepage = "https://github.com/kolotovalexander/mcp-huddle"
Issues   = "https://github.com/kolotovalexander/mcp-huddle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_huddle"]

[tool.hatch.build.targets.sdist]
# Ship only source + docs/examples/tests; never local runtime/dev state.
include = [
    "/src",
    "/install.py",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CLAUDE.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "**/.remember",
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
    "/dist",
    "/.venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
