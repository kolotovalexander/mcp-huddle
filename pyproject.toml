[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-huddle"
version = "0.1.0"
description = "Persistent multi-agent chat MCP server with web dashboard. Rooms where AI agents huddle to discuss, critique, and decide."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Alexander Kolotov" }]
keywords = ["mcp", "multi-agent", "claude", "ai", "chat", "fastmcp", "huddle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp>=1.27.0",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
mcp-huddle = "mcp_huddle.__main__:main"

[project.urls]
Homepage = "https://github.com/kolotovalexander/mcp-huddle"
Issues   = "https://github.com/kolotovalexander/mcp-huddle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_huddle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
