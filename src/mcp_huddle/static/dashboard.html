<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🤖 Agent Bus</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script>
    // Apply saved/auto theme synchronously BEFORE first paint to avoid FOUC
    // (white flash on dark theme during dashboard.js load).
    (function() {
      try {
        var raw = localStorage.getItem('agentbus-theme');
        var mode = (raw === 'dark' || raw === 'light' || raw === 'auto') ? raw : 'auto';
        if (mode === 'auto') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', mode);
        var skin = localStorage.getItem('agentbus-skin');
        skin = (skin === 'web' || skin === 'code' || skin === 'glass') ? skin : 'glass';
        document.documentElement.setAttribute('data-skin', skin);
        var PALETTES = ['default','dracula','nord','tokyonight','catppuccin','gruvbox'];
        var pal = localStorage.getItem('agentbus-palette');
        document.documentElement.setAttribute('data-palette', PALETTES.indexOf(pal) >= 0 ? pal : 'default');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-skin', 'glass');
        document.documentElement.setAttribute('data-palette', 'default');
      }
    })();
  </script>
</head>
<body>
<div class="bg-decor"></div>
<div class="bg-noise"></div>
<div class="app">
  <header class="topbar lq-panel">
    <div class="brand">
      <div class="logo"><span>AB</span></div>
      <div class="brand-text">
        <div class="title">Agent Bus</div>
        <div class="subtitle"><span id="room-count">0</span> rooms &middot; multi-agent discussion</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="lq-btn" id="sidebar-collapse" title="Свернуть/развернуть список комнат">◧</button>
      <button class="lq-btn" id="activity-collapse" title="Свернуть/развернуть панель активности">◨</button>
      <button class="lq-btn" id="bulk-close-all" title="Закрыть все открытые комнаты — kill живых spawned PIDs (кроме owner-ов)">Close all</button>
      <button class="lq-btn" id="bulk-delete-closed" title="Удалить с диска все закрытые комнаты">Delete closed</button>
      <button class="lq-btn danger" id="bulk-nuke" title="Закрыть + удалить ВСЕ комнаты. Owner PIDs не трогаются.">🔥 Nuke all</button>
      <button class="lq-btn" id="settings-btn" title="Настройки (оформление + MCP)" aria-haspopup="true" aria-expanded="false">⚙️ Вид</button>
      <button class="lq-btn"><span class="dot dot-open pulse" style="color: var(--c-codex)"></span> live</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar lq-panel">
      <button class="panel-collapse-btn pc-left" data-side="sidebar" title="Свернуть список комнат" aria-label="Свернуть">◧</button>
      <div class="sidebar-scroll" id="room-list"></div>
    </aside>
    <div class="panel-resizer" id="sidebar-resizer" title="Drag to resize · double-click to collapse"></div>
    <section class="chat lq-panel" id="chat-area">
      <div class="empty">
        <div class="empty-title">Select a room</div>
        <div class="empty-hint">Use room_create() from an agent to start a discussion</div>
      </div>
    </section>
    <div class="panel-resizer" id="activity-resizer" title="Drag to resize · double-click to collapse"></div>
    <aside class="activity lq-panel">
      <button class="panel-collapse-btn pc-right" data-side="activity" title="Свернуть панель активности" aria-label="Свернуть">◨</button>
      <div class="activity-scroll" id="activity-panel">
        <div class="activity-empty">
          <div class="activity-empty-title">Agent activity</div>
          <div class="activity-empty-hint">Откроется при выборе комнаты со spawned-агентами</div>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<div class="settings-popover" id="settings-popover" hidden></div>
<script src="/static/dashboard.js"></script>
</body>
</html>
