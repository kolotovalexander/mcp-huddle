<style>
:root{color-scheme:light;--paper:#f2f0e8;--sheet:#fbfaf6;--ink:#181b1d;--muted:#77776f;--rule:#d8d5cb;--blue:#203fc2;--blue-soft:#e7eaff;--orange:#d35330;--green:#3d6a52;--serif:Georgia,'Times New Roman',serif;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);min-height:100vh}button,input{font:inherit}button{color:inherit}a{color:inherit}.frame{max-width:1600px;margin:auto;min-height:100vh;padding:24px 32px 30px}.masthead{height:62px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);margin-bottom:22px}.wordmark{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:720;letter-spacing:-.05em}.mark{width:31px;height:31px;background:var(--blue);color:white;display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-style:italic}.mast-left{display:flex;align-items:center;gap:30px}.edition{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.mast-right{display:flex;align-items:center;gap:18px}.demo-flag{font:10px var(--mono);letter-spacing:.05em;color:var(--orange);border:1px solid #ddaa99;padding:5px 8px;text-transform:uppercase}.plain-action{border:0;background:none;padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer;color:var(--muted);font-size:12px}.plain-action:hover{color:var(--blue);border-color:var(--blue)}
.workspace{display:grid;grid-template-columns:306px minmax(0,1fr);gap:42px;align-items:start}.rail{min-height:calc(100vh - 132px);border-right:1px solid var(--rule);padding:0 24px 0 0;display:flex;flex-direction:column}.rail-title{display:flex;align-items:baseline;justify-content:space-between;margin:3px 0 17px}.rail-title h1{font:italic 27px/1 var(--serif);font-weight:400;margin:0;letter-spacing:-.04em}.count{font:11px var(--mono);color:var(--muted)}.search{position:relative;margin-bottom:17px}.search input{width:100%;border:1px solid #bcb9b0;background:var(--sheet);border-radius:2px;padding:12px 38px 12px 13px;outline:0;color:var(--ink)}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 2px #203fc21c}.search input::placeholder{color:#9b9a92}.search-icon{position:absolute;right:12px;top:10px;color:var(--muted);font-size:17px}.search-hint{font:10px var(--mono);color:#9b9a92;margin:6px 1px 0}.group-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font:10px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.group-head span:last-child{font-size:9px;letter-spacing:.04em}.project-list{display:flex;flex-wrap:wrap;gap:6px}.project-chip{background:none;border:1px solid var(--rule);padding:5px 8px;border-radius:99px;font-size:11px;color:#5f605c;cursor:pointer}.project-chip:hover,.project-chip.on{color:var(--blue);border-color:var(--blue);background:#e7eaff}.room-list{display:grid;gap:2px}.room{display:block;text-align:left;width:100%;background:transparent;border:0;border-left:2px solid transparent;padding:10px 9px 10px 11px;cursor:pointer;transition:background .14s}.room:hover{background:#eae8e0}.room.selected{background:var(--sheet);border-left-color:var(--blue)}.room-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.room-name{font-weight:620;font-size:12px;line-height:1.3}.room-time{font:10px var(--mono);color:#88877f;white-space:nowrap}.room-meta{display:flex;align-items:center;gap:7px;margin-top:5px;color:var(--muted);font-size:10px}.room-preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.mini-avatars{display:flex;align-items:center}.mini-avatar{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:#d8ddf7;color:#293ca0;font:9px var(--mono);border:1px solid var(--sheet);margin-left:-4px}.mini-avatar:first-child{margin-left:0}.empty-results{padding:14px 10px;color:var(--muted);font-size:12px}.rail-bottom{margin-top:auto;border-top:1px solid var(--rule);padding-top:15px}.settings-label{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.setting-row{display:flex;justify-content:space-between;align-items:center;margin:9px 0;color:#5f605c;font-size:11px}.segmented{display:flex;border:1px solid var(--rule);padding:2px;gap:1px;background:#eeece5}.segmented button{border:0;background:transparent;padding:4px 7px;font-size:10px;cursor:pointer;color:var(--muted)}.segmented button.active{background:var(--sheet);color:var(--blue);box-shadow:0 0 0 1px var(--rule)}
.main{min-width:0;padding:2px 14px 0 0}.room-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:2px 0 18px;border-bottom:1px solid var(--ink)}.eyebrow{font:10px var(--mono);color:var(--blue);text-transform:uppercase;letter-spacing:.14em;margin-bottom:9px}.room-heading h2{font:clamp(29px,3vw,45px)/1.02 var(--serif);font-weight:400;letter-spacing:-.045em;margin:0;max-width:900px}.room-sub{margin-top:11px;display:flex;gap:9px;align-items:center;color:var(--muted);font-size:11px}.room-sub .slash{color:#c0bdb2}.head-tools{display:flex;gap:8px;flex-shrink:0}.outline-btn{background:transparent;border:1px solid var(--rule);padding:8px 11px;font-size:11px;cursor:pointer}.outline-btn:hover{color:var(--blue);border-color:var(--blue)}
.flow{display:grid;grid-template-columns:140px minmax(0,1fr);border-bottom:1px solid var(--rule);padding:17px 0 19px;gap:20px}.flow-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);padding-top:3px}.flow-label b{color:var(--ink);display:block;font:italic 18px var(--serif);text-transform:none;letter-spacing:0;margin:0 0 4px}.flow-track{display:flex;align-items:stretch;min-width:0}.flow-step{min-width:120px;max-width:220px;flex:1;position:relative;padding:0 12px 0 15px;border-left:1px solid var(--rule)}.flow-step:first-child{border-left:0;padding-left:0}.flow-step:not(:last-child):after{content:'→';position:absolute;right:-7px;top:11px;color:#a6a39a;background:var(--paper);z-index:1;padding:0 2px}.flow-agent{font-size:11px;font-weight:650}.flow-kind{display:block;font:9px var(--mono);color:var(--blue);margin:3px 0 6px;text-transform:uppercase;letter-spacing:.05em}.flow-copy{font-size:10px;color:var(--muted);line-height:1.35}
.conversation{max-width:920px}.dayline{display:flex;align-items:center;gap:12px;font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:#88877f;margin:20px 0 8px}.dayline:after{content:'';height:1px;background:var(--rule);flex:1}.message{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid #e3e0d6}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e0e3f7;color:#293ca0;font:11px var(--mono)}.avatar.orange{background:#f3e1d9;color:#a4462c}.avatar.green{background:#deeadf;color:#376148}.avatar.gold{background:#eee7d5;color:#755d24}.message-head{display:flex;align-items:baseline;gap:8px}.author{font-size:12px;font-weight:680}.role{font:9px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.time{font:10px var(--mono);color:#98968d;margin-left:auto}.message p{margin:5px 0 0;color:#40413e;font-size:12px;line-height:1.56;max-width:790px}.message mark{background:#ffdf9d;color:inherit;padding:0 1px}.reply-link{color:var(--blue);font-size:10px;text-decoration:none;display:inline-block;margin-top:6px}.reply-link:hover{text-decoration:underline}.notice{display:inline-flex;align-items:center;gap:8px;margin:7px 0 7px 51px;padding:6px 9px;border-left:2px solid #d8ac55;color:#77705e;font-size:10px;background:#eeeadd}.notice b{color:#514a39;font-weight:600}.search-result{outline:2px solid #e1a32e;outline-offset:2px;background:#fff9e9}.composer{display:flex;align-items:center;gap:10px;padding:17px 0 0;color:#918f85;font-size:11px}.composer-box{flex:1;border:1px dashed #cac6bb;padding:11px 13px}.composer button{border:0;background:var(--blue);color:white;padding:10px 14px;font-size:11px;opacity:.38;cursor:default}.search-banner{display:none;background:#fff5d9;border:1px solid #e4c773;padding:8px 11px;margin-top:14px;font-size:11px;color:#625634}.search-banner.show{display:block}.no-room{min-height:400px;display:grid;place-items:center;color:var(--muted);font:italic 23px var(--serif)}
body.night{--paper:#202321;--sheet:#282c29;--ink:#ebe8dc;--muted:#aaa99e;--rule:#41453f;--blue:#aab7ff;--blue-soft:#32394f;--orange:#ed9a7b;--green:#8ab798}body.night .room:hover{background:#2e322f}body.night .room.selected{background:var(--sheet)}body.night .search input{background:var(--sheet);color:var(--ink)}body.night .project-chip.on{background:#33384b}body.night .message p{color:#d0cec4}body.night .notice{background:#39372c;color:#c9c1a9}body.night .notice b{color:#f0e7c8}body.night .flow-step:not(:last-child):after{background:var(--paper)}body.night .room.selected .mini-avatar{border-color:var(--sheet)}body.night .room:hover{background:#2b302c}
@media(max-width:920px){.frame{padding:15px}.workspace{grid-template-columns:255px minmax(0,1fr);gap:22px}.rail{padding-right:14px}.flow{grid-template-columns:1fr;gap:11px}.flow-track{overflow:auto;padding-bottom:5px}.flow-step{min-width:140px}}
@media(max-width:680px){body{overflow:auto}.frame{padding:0 15px}.masthead{height:55px}.edition{display:none}.workspace{display:flex;flex-direction:column;gap:23px}.rail{width:100%;min-height:0;border-right:0;border-bottom:1px solid var(--rule);padding:0 0 15px}.rail-bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.rail-bottom .settings-label{grid-column:1/-1;margin-bottom:0}.main{padding:0 0 25px;width:100%}.room-list{grid-template-columns:1fr 1fr}.room-head{flex-direction:column}.head-tools{align-self:flex-end}.flow{padding:12px 0}.message{grid-template-columns:34px minmax(0,1fr);gap:9px}.avatar{width:28px;height:28px}.notice{margin-left:43px}.room-heading h2{font-size:34px}}
</style>
</head>
<body>
<div class="frame">
  <header class="masthead">
    <div class="mast-left"><div class="wordmark"><span class="mark">h</span><span>huddle</span></div><div class="edition">рабочие разговоры · 01</div></div>
    <div class="mast-right"><span class="demo-flag">сценарий макета · не live</span><button class="plain-action" id="help">О макете ↗</button></div>
  </header>
  <div class="workspace">
    <aside class="rail" aria-label="Навигация по комнатам">
      <div class="rail-title"><h1>Комнаты</h1><span class="count" id="room-count"></span></div>
      <label class="search"><input id="search" type="search" placeholder="Название или текст сообщения" autocomplete="off"><span class="search-icon">⌕</span><div class="search-hint">Поиск по всем комнатам и сообщениям</div></label>
      <div class="group-head"><span>Проекты</span><span>быстрый переход</span></div>
      <div class="project-list" id="projects"></div>
      <div class="group-head"><span id="list-title">Недавние комнаты</span><span id="result-count"></span></div>
      <nav class="room-list" id="room-list"></nav>
      <div class="rail-bottom">
        <div class="settings-label">Настройки вида</div>
        <div class="setting-row"><span>Оформление</span><div class="segmented" id="theme-control"><button data-theme="light" class="active">Светлое</button><button data-theme="night">Тёмное</button></div></div>
        <div class="setting-row"><span>Порядок</span><div class="segmented" id="sort-control"><button data-sort="recent" class="active">Недавние</button><button data-sort="project">Проекты</button></div></div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<script>
(function(){
'use strict';
var rooms=[
 {id:'r1',project:'Photo Studio',name:'Бронь без лишних шагов',time:'10:42',members:['Лена','Codex','Claude'],owner:'Александр',messages:[
  {by:'Александр',role:'автор',at:'10:18',tone:'orange',text:'Посмотрите на путь бронирования: где человек теряет контекст между выбором слота и оплатой?'},
  {by:'Claude',role:'исследование',at:'10:26',tone:'gold',text:'Самый хрупкий момент — возврат после оплаты. Подтверждение должно повторять дату, время и адрес студии.'},
  {by:'Codex',role:'код',at:'10:34',tone:'green',text:'В интерфейсе уже есть данные заказа. Можно вывести короткую сводку рядом с кнопкой подтверждения, без нового шага.'},
  {by:'Лена',role:'дизайн',at:'10:42',tone:'blue',text:'Предлагаю оставить один главный вопрос на экран: «Всё верно?» Под ним — слот, услуга и итоговая сумма.'}],flow:[['Александр','вопрос','Уточнил точку трения'],['Claude','наблюдение','Нашла риск после оплаты'],['Codex','вариант','Предложил сводку заказа'],['Лена','решение','Собрала один следующий шаг']]},
 {id:'r2',project:'Huddle',name:'Новый вид комнаты и поиска',time:'09:56',members:['Александр','Codex','Мила'],owner:'Александр',messages:[
  {by:'Александр',role:'автор',at:'09:31',tone:'orange',text:'Нужен поиск, который находит и название комнаты, и нужные слова в старых сообщениях.'},
  {by:'Codex',role:'вариант',at:'09:43',tone:'green',text:'Поиск может сразу показывать комнаты и короткий фрагмент совпавшего сообщения.'},
  {by:'Мила',role:'дизайн',at:'09:56',tone:'blue',text:'Добавлю быстрые проекты и недавние комнаты рядом. Настройки оформления будут видны внизу списка, без огромного меню.'}],flow:[['Александр','вопрос','Задал сценарий поиска'],['Codex','вариант','Описал выдачу совпадений'],['Мила','макет','Собрала навигацию и вид']]},
 {id:'r3',project:'Photo Studio',name:'Письмо после съёмки',time:'Вчера',members:['Александр','Claude'],owner:'Александр',messages:[
  {by:'Александр',role:'автор',at:'16:10',tone:'orange',text:'Хотим попросить отзыв, не превращая благодарность в рекламный текст.'},
  {by:'Claude',role:'редактор',at:'16:22',tone:'gold',text:'Начните с личной благодарности и оставьте одну необязательную ссылку на отзыв.'}],flow:[['Александр','вопрос','Описал тон письма'],['Claude','редактура','Предложила короткий вариант']]},
 {id:'r4',project:'AgentSync',name:'Подключение нового инструмента',time:'Вчера',members:['Codex','Александр','Илья'],owner:'Александр',messages:[
  {by:'Codex',role:'инженерия',at:'14:02',tone:'green',text:'Сначала стоит проверить, есть ли готовый маршрут в каталоге инструментов.'},
  {by:'Илья',role:'исследование',at:'14:19',tone:'gold',text:'Нашёл существующий MCP-коннектор. Отдельный сервер пока не нужен.'},
  {by:'Александр',role:'автор',at:'14:28',tone:'orange',text:'Зафиксируем подключение как проверенный вариант и вернёмся к нему при настройке проекта.'}],flow:[['Codex','проверка','Сверил каталог'],['Илья','находка','Нашёл готовый коннектор'],['Александр','итог','Зафиксировал следующий шаг']]},
 {id:'r5',project:'ResearchHub',name:'Сводка источников для обзора',time:'Пн',members:['Claude','Александр'],owner:'Александр',messages:[
  {by:'Claude',role:'исследование',at:'11:06',tone:'gold',text:'Разделю материал на первичные источники, практические примеры и открытые вопросы.'},
  {by:'Александр',role:'автор',at:'11:20',tone:'orange',text:'В итоговой заметке оставь ссылки рядом с выводами, чтобы их можно было быстро перепроверить.'}],flow:[['Claude','сводка','Разложила источники'],['Александр','уточнение','Попросил ссылки у выводов']]}
];
var selected='r1',query='',projectFilter='',sort='recent',searchHit=null;
var initials={Александр:'А',Лена:'Л',Claude:'C',Codex:'C',Мила:'М',Илья:'И'};
var toneClass={orange:'orange',green:'green',gold:'gold',blue:''};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function activeRoom(){return rooms.filter(function(r){return r.id===selected})[0]||rooms[0]}
function shortText(t){return t.length>73?t.slice(0,70)+'…':t}
function matches(r){var q=query.toLocaleLowerCase('ru');if(!q)return true;return (r.name+' '+r.project+' '+r.messages.map(function(m){return m.text+' '+m.by}).join(' ')).toLocaleLowerCase('ru').indexOf(q)>=0}
function hitMessage(r){if(!query)return null;var q=query.toLocaleLowerCase('ru');for(var i=0;i<r.messages.length;i++)if(r.messages[i].text.toLocaleLowerCase('ru').indexOf(q)>=0)return r.messages[i];return null}
function renderProjects(){var ps=Array.from(new Set(rooms.map(function(r){return r.project})));document.getElementById('projects').innerHTML='<button class="project-chip '+(!projectFilter?'on':'')+'" data-project="">Все</button>'+ps.map(function(p){return '<button class="project-chip '+(projectFilter===p?'on':'')+'" data-project="'+esc(p)+'">'+esc(p)+'</button>'}).join('');document.querySelectorAll('.project-chip').forEach(function(b){b.onclick=function(){projectFilter=b.getAttribute('data-project');render()}})}
function renderList(){var shown=rooms.filter(function(r){return matches(r)&&(!projectFilter||r.project===projectFilter)});if(sort==='recent')shown.sort(function(a,b){return rooms.indexOf(a)-rooms.indexOf(b)});else shown.sort(function(a,b){return a.project.localeCompare(b.project,'ru')||rooms.indexOf(a)-rooms.indexOf(b)});document.getElementById('room-count').textContent=rooms.length+' комнаты';document.getElementById('list-title').textContent=sort==='recent'?'Недавние комнаты':'По проектам';document.getElementById('result-count').textContent=query?shown.length+' найдено':'';var el=document.getElementById('room-list');if(!shown.length){el.innerHTML='<div class="empty-results">Совпадений нет. Попробуйте другое слово.</div>';return}el.innerHTML=shown.map(function(r){var hm=hitMessage(r);return '<button class="room '+(r.id===selected?'selected':'')+'" data-id="'+r.id+'"><span class="room-top"><span class="room-name">'+esc(r.name)+'</span><span class="room-time">'+esc(r.time)+'</span></span><span class="room-meta"><span>'+esc(r.project)+'</span><span>·</span><span class="mini-avatars">'+r.members.map(function(n){return '<i class="mini-avatar" title="'+esc(n)+'">'+esc(initials[n]||n[0])+'</i>'}).join('')+'</span><span class="room-preview">'+esc(hm?shortText(hm.text):shortText(r.messages[r.messages.length-1].text))+'</span></span></button>'}).join('');el.querySelectorAll('.room').forEach(function(b){b.onclick=function(){selected=b.getAttribute('data-id');searchHit=null;render()}})}
function markText(text){if(!query)return esc(text);var at=text.toLocaleLowerCase('ru').indexOf(query.toLocaleLowerCase('ru'));if(at<0)return esc(text);return esc(text.slice(0,at))+'<mark>'+esc(text.slice(at,at+query.length))+'</mark>'+esc(text.slice(at+query.length))}
function renderMain(){var r=activeRoom(),main=document.getElementById('main');if(!r){main.innerHTML='<div class="no-room">Выберите комнату</div>';return}var msgs=r.messages.map(function(m,i){return '<article class="message '+(searchHit&&searchHit.at===i?'search-result':'')+'"><div class="avatar '+(toneClass[m.tone]||'')+'">'+esc(initials[m.by]||m.by[0])+'</div><div><div class="message-head"><span class="author">'+esc(m.by)+'</span><span class="role">'+esc(m.role)+'</span><time class="time">'+esc(m.at)+'</time></div><p>'+markText(m.text)+'</p>'+(m.by==='Claude'?'<a href="#" class="reply-link">↳ ответ в обсуждении</a>':'')+'</div></article>'}).join('');var flow=r.flow.map(function(f){return '<div class="flow-step"><span class="flow-agent">'+esc(f[0])+'</span><span class="flow-kind">'+esc(f[1])+'</span><div class="flow-copy">'+esc(f[2])+'</div></div>'}).join('');var found=searchHit?'<div class="search-banner show">Найдено в комнате: <b>'+esc(searchHit.by)+'</b> · «'+esc(shortText(searchHit.text))+'»</div>':'';main.innerHTML='<header class="room-head"><div class="room-heading"><div class="eyebrow">'+esc(r.project)+'　/　комната '+esc(r.id)+'</div><h2>'+esc(r.name)+'</h2><div class="room-sub"><span>Автор: '+esc(r.owner)+'</span><span class="slash">/</span><span>'+r.members.length+' участника</span><span class="slash">/</span><span>последнее сообщение '+esc(r.time)+'</span></div></div><div class="head-tools"><button class="outline-btn" type="button">Скопировать ссылку ↗</button></div></header><section class="flow"><div class="flow-label"><b>Ход разговора</b>последовательность реплик в примере</div><div class="flow-track">'+flow+'</div></section>'+found+'<section class="conversation"><div class="dayline">Сегодня · пример переписки</div>'+msgs+'</section><div class="composer"><span>Вы</span><div class="composer-box">Поле ответа показано для контекста. Макет не отправляет сообщения.</div><button disabled>Отправить ↗</button></div>'}
function render(){renderProjects();renderList();renderMain();document.getElementById('sort-control').querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-sort')===sort)})}
document.getElementById('search').addEventListener('input',function(e){query=e.target.value.trim();var first=null;if(query){for(var i=0;i<rooms.length;i++){var h=hitMessage(rooms[i]);if(h){first={room:rooms[i],message:h,at:rooms[i].messages.indexOf(h)};break}}}if(first){selected=first.room.id;searchHit=first}else searchHit=null;render()});
document.getElementById('sort-control').addEventListener('click',function(e){var s=e.target.getAttribute('data-sort');if(s){sort=s;render()}});
document.getElementById('theme-control').addEventListener('click',function(e){var t=e.target.getAttribute('data-theme');if(!t)return;document.body.classList.toggle('night',t==='night');document.querySelectorAll('#theme-control button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-theme')===t)})});
document.getElementById('help').addEventListener('click',function(){alert('Это самостоятельный демонстрационный макет. Переписки и участники здесь — пример; соединения с Huddle нет.')});render();
})();
</script>
</body>
</html>
